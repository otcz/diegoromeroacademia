## Perfil del entorno de DEMOSTRACION en el servidor de laboratorio (ADR 0007).
##
## No es produccion. Sirve para que Diego revise pantallas y apruebe diseno.
## Aqui NO se cargan datos personales reales ni credenciales de pasarela de produccion.

spring:
  jpa:
    hibernate:
      ddl-auto: validate

server:
  error:
    # Mas detalle que en produccion: el objetivo es diagnosticar rapido lo que se rompa
    # mientras se construye, y no hay datos reales que proteger.
    include-message: always
    include-stacktrace: never

  servlet:
    session:
      cookie:
        # La cookie de sesion identifica al alumno: si viaja en claro, quien escuche la red
        # entra como el. `secure` la limita a HTTPS, que es como se sirve el dominio.
        #
        # Va en este perfil y no en el base a proposito: en local se entra por
        # http://localhost y con `secure` la sesion no se guardaria nunca.
        secure: true
        http-only: true
        # `lax` y no `strict`: el ingreso vuelve de Google por una redireccion de otro sitio,
        # y con `strict` el navegador no manda la cookie en ese salto — se pierde el estado
        # de OAuth y el ingreso falla justo al final.
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.academiadiegoromero: DEBUG

academia:
  # Todas las fases encendidas: si Diego no puede ver una pantalla, no puede aprobarla.
  funcionalidades:
    examenes-habilitados: true
    certificados-habilitados: true
    simulador-habilitado: true
    tienda-habilitada: true
    login-facebook-habilitado: false
