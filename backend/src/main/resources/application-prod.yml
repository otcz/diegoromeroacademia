## Perfil de produccion (Cloud Run).
##
## Toda credencial llega desde Google Secret Manager inyectada como variable de entorno.
## Este archivo no contiene ni un secreto (docs/03 §5).

spring:
  jpa:
    properties:
      hibernate:
        # Nunca generar ni tocar esquema en produccion.
        hbm2ddl:
          auto: none

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  # Registro estructurado para que Cloud Logging lo indexe y se pueda filtrar por
  # idCorrelacion en vez de leer texto plano (docs/01 §10).
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.academiadiegoromero: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
