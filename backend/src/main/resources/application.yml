## Configuracion base de la Academia Diego Romero.
##
## Regla 5: todo se configura por variables de entorno. Aqui solo viven valores por defecto
## seguros y no sensibles. Ningun secreto entra a este archivo (docs/03 §5).
## El inventario completo de parametros esta en docs/03-configuracion.md §3.

spring:
  application:
    name: academia-backend

  # Regla 13: concurrencia alta sin complicar el modelo de programacion.
  threads:
    virtual:
      enabled: true

  datasource:
    # Sin valor por defecto a proposito: si falta, el arranque debe fallar de inmediato.
    url: ${BD_URL}
    username: ${BD_USUARIO}
    password: ${BD_CONTRASENA}
    hikari:
      maximum-pool-size: ${BD_POOL_MAXIMO:20}
      connection-timeout: 10000

  jpa:
    hibernate:
      # Las migraciones son SQL manual versionado (especificacion §16.1). Hibernate solo
      # verifica que el esquema coincida: si no coincide, la aplicacion no arranca, que es
      # mucho mejor que descubrirlo con una consulta rota en produccion.
      ddl-auto: validate
    # Evita que una vista mantenga abierta la sesion de persistencia y dispare consultas
    # perezosas fuera de la transaccion, causa habitual del problema N+1.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m

  security:
    oauth2:
      client:
        registration:
          google:
            # El ID es publico; el SECRETO nunca entra a este archivo ni al repositorio
            # (no negociable #8). Vive en despliegue/.env y en Secret Manager en produccion.
            # Sin valor por defecto a proposito: si falta, el arranque falla de inmediato en
            # vez de dejar un boton de Google que rompe al pulsarlo.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

            # DEBE coincidir EXACTAMENTE con el URI registrado en la consola de Google.
            # No se usa el valor por defecto de Spring (/login/oauth2/code/...) porque nginx
            # solo enruta al backend lo que empieza por /api/: con la ruta de serie, Google
            # devolveria el codigo a la aplicacion de Angular y el ingreso fallaria en
            # silencio. Ver ConfiguracionSeguridad.
            redirect-uri: "{baseUrl}/api/acceso/oauth2/callback/{registrationId}"

server:
  port: ${PUERTO:8080}

  # Detras de nginx, la aplicacion recibe HTTP plano aunque el navegador haya usado HTTPS.
  # Sin esto, Spring construye sus URL absolutas con el esquema que VE, no con el que vio el
  # visitante, y el redirect_uri que se manda a Google sale como http:// — que no coincide
  # con el https:// registrado en su consola y produce `redirect_uri_mismatch`.
  #
  # `framework` hace que se honren las cabeceras X-Forwarded-* que nginx ya envia. Es seguro
  # aqui porque el unico que puede alcanzar al backend es nginx, por la red interna de Docker:
  # el contenedor no publica ningun puerto.
  forward-headers-strategy: framework
  error:
    # docs/06 §6: al cliente nunca le llega el detalle interno de un error.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.academiadiegoromero: INFO

academia:
  api:
    tamanio-pagina-por-defecto: 20
    tamanio-pagina-maximo: 100
    limite-peticiones-por-minuto: 120
    # diegoromeroacademia.com, NO diegoromeroacordeon.com: ese segundo dominio nunca llego a
    # registrarse (NXDOMAIN) y quedo de la especificacion. Ver decision pendiente #10.
    origenes-permitidos: ${ORIGENES_PERMITIDOS:https://diegoromeroacademia.com}

  identidad:
    # A donde vuelve el navegador cuando Google confirma. Relativo: sirve igual en local y en
    # el servidor, porque el frontend y la API comparten origen detras de nginx.
    #
    # Era `/` mientras el alumno no tenia panel al que llegar. Ahora existe (ADR 0013). Tiene
    # que coincidir con `DESTINO_TRAS_INGRESAR` de `frontend/src/app/app.routes.ts`: si no,
    # se entra a un sitio distinto segun se use Google o el formulario de correo, y esa es la
    # clase de diferencia que nadie nota hasta que un alumno la reporta.
    destino-tras-ingresar: ${IDENTIDAD_DESTINO_OK:/inicio}
    destino-tras-fallar: ${IDENTIDAD_DESTINO_ERROR:/acceso}

  seguridad:
    expiracion-token-acceso: PT15M
    expiracion-token-refresco: P30D
    expiracion-token-recuperacion: PT1H
    dispositivos-simultaneos-maximos: 2
    intentos-login-maximos: 5
    bloqueo-tras-intentos-fallidos: PT15M

  funcionalidades:
    examenes-habilitados: false        # fase 2
    certificados-habilitados: false    # fase 2
    simulador-habilitado: false        # fase 3
    tienda-habilitada: false           # fase 4
    login-facebook-habilitado: false   # prioridad media, especificacion §5.1

  ## Los bloques siguientes quedan declarados como contrato de configuracion. Su record
  ## de propiedades se crea junto con el modulo que los usa, para no dejar codigo
  ## especulativo en el repositorio (docs/07 §4, definicion de terminado).

  video:
    expiracion-url-firmada: PT5M
    marca-agua-habilitada: true
    dominios-autorizados: ${VIDEO_DOMINIOS_AUTORIZADOS:https://diegoromeroacordeon.com}
    proveedor: ${VIDEO_PROVEEDOR:}     # decision pendiente #3

  evaluacion:
    peso-teoria: 0.40                  # especificacion §7.3
    peso-practica: 0.60                # peso-teoria + peso-practica debe sumar 1.0
    intentos-maximos: 3
    tamanio-maximo-video-mb: 200
    formatos-video-permitidos: mp4,mov

  practica:
    bpm-minimo: 40
    bpm-maximo: 200
    afinaciones-soportadas: FBE,GCF,ADG

  comercio:
    moneda: COP
    pais-por-defecto: CO
    pasarela: ${COMERCIO_PASARELA:}    # decision pendiente #1
    reintentos-webhook: 5

  whatsapp:
    numero: ${WHATSAPP_NUMERO:}
    mensaje-plantilla: ${WHATSAPP_MENSAJE:Hola, quiero informacion sobre las clases de acordeon}
