# Entorno de DEMOSTRACION en el servidor de laboratorio (ADR 0007).
#
# No es produccion. Produccion va en Cloud Run: aqui no se ponen datos personales reales
# ni credenciales de pasarela de produccion.
#
# Convive con los contenedores de otros dos proyectos en la misma maquina, asi que todo
# lleva prefijo propio y puertos propios:
#   8080 lo ocupa el explorador de Hermes · 8090 guardian-web · 5432 hermes-pg
# Por eso la Academia publica solo el 8091, y solo en loopback: quien la expone a internet
# es el tunel, no Docker.

name: academia

services:
  academia-pg:
    image: postgres:17-alpine
    container_name: academia-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-academia}
      POSTGRES_USER: ${BD_USUARIO:-academia}
      POSTGRES_PASSWORD: ${BD_CONTRASENA:?falta BD_CONTRASENA en despliegue/.env}
    volumes:
      - /data/academia/postgres:/var/lib/postgresql/data
    # Sin `ports`: la base no se asoma ni siquiera a loopback. Solo la alcanza el backend
    # por la red interna de Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USUARIO:-academia} -d ${BD_NOMBRE:-academia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  academia-api:
    build:
      context: ../backend
    image: academia-api:local
    container_name: academia-api
    restart: unless-stopped
    depends_on:
      academia-pg:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demostracion
      BD_URL: jdbc:postgresql://academia-pg:5432/${BD_NOMBRE:-academia}
      BD_USUARIO: ${BD_USUARIO:-academia}
      BD_CONTRASENA: ${BD_CONTRASENA:?falta BD_CONTRASENA en despliegue/.env}
      ORIGENES_PERMITIDOS: ${URL_PUBLICA:?falta URL_PUBLICA en despliegue/.env}

      # Credenciales de Google. Sin esta pareja de lineas, la variable existe en el archivo
      # de entorno pero NUNCA llega al contenedor: compose solo inyecta lo que se nombra
      # aqui, y el arranque parecia correcto con un boton de Google que no podia funcionar.
      #
      # Van SIN `:?` a proposito, al contrario que las de base de datos: compose interpola el
      # archivo entero, asi que un `:?` aqui impediria tambien desplegar el frontend mientras
      # las credenciales no esten puestas. Quien valida es la aplicacion, con
      # `CredencialesGooglePropiedades`, que ademas comprueba la FORMA de cada una.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Sin `ports`: solo lo alcanza nginx por la red interna.

  academia-web:
    build:
      context: ../frontend
    image: academia-web:local
    container_name: academia-web
    restart: unless-stopped
    depends_on:
      - academia-api
    ports:
      # Solo loopback, y solo para poder verlo en local por un tunel SSH mientras no hay
      # dominio:  ssh -L 8091:127.0.0.1:8091 servidor
      #
      # El tunel de Cloudflare NO pasa por aqui: alcanza a este contenedor por la red
      # interna de Docker. Cuando el dominio este publicado, esta linea se puede quitar
      # y no quedara ni un puerto abierto en el host.
      #
      # Importante: el servidor no tiene cortafuegos activo (ufw esta instalado pero con
      # ENABLED=no). Lo unico que impide que esto quede servido a toda la red de la
      # oficina es el 127.0.0.1 de esta linea. Nunca cambiarlo por 0.0.0.0.
      - "127.0.0.1:8091:80"
    volumes:
      # Contrasena de la demostracion. Lo genera quien despliega, nunca se versiona.
      # Si falta, nginx no arranca: preferimos un despliegue fallido a una demo abierta.
      - /data/academia/htpasswd:/etc/nginx/.htpasswd:ro

  # Publica la demostracion en internet sin abrir un solo puerto del router: el tunel sale
  # DESDE el servidor hacia Cloudflare. Evita depender de una IP publica fija y da TLS.
  #
  # Va en un perfil aparte para que el resto del entorno se pueda levantar sin token:
  #   docker compose --profile tunel up -d
  academia-tunel:
    image: cloudflare/cloudflared:latest
    container_name: academia-tunel
    restart: unless-stopped
    profiles: ["tunel"]
    # Red interna de este compose, NO la del host.
    #
    # Con network_mode: host el tunel alcanzaria cualquier puerto de loopback de la
    # maquina, incluidas las bases de datos de los otros dos proyectos que conviven en
    # ella. Aqui solo ve a sus propios servicios, y el destino se declara por nombre de
    # contenedor: en Cloudflare el hostname publico apunta a http://academia-web:80,
    # no a 127.0.0.1:8091.
    command: tunnel --no-autoupdate run
    environment:
      # Token del tunel, creado en Cloudflare Zero Trust. Es un secreto: vive en
      # despliegue/.env, nunca en el repositorio.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - academia-web
