# nginx del entorno de demostracion.
#
# Sirve el frontend y hace de proxy hacia el backend en la misma URL, de modo que el
# navegador ve un solo origen y no hay CORS que resolver.
#
# Solo para el entorno de demostracion del ADR 0007. Produccion va en Cloud Run.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel expone esto a internet, asi que la demostracion va cerrada con
    # contrasena. El archivo lo genera quien despliega; sin el, nginx no arranca — es
    # deliberado: preferimos que falle el despliegue a publicar sin proteccion.
    auth_basic "Academia Diego Romero — entorno de demostracion";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Cabeceras de seguridad (docs/06 §6).
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Este entorno NO debe aparecer en Google: es material sin terminar bajo la marca
    # personal de Diego.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass         http://academia-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Los archivos con huella en el nombre no cambian nunca: se pueden cachear para siempre.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular resuelve el enrutado en el navegador, asi que cualquier ruta desconocida
    # devuelve index.html en vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
