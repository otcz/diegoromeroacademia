# nginx del entorno de demostracion.
#
# Sirve el frontend y hace de proxy hacia el backend en la misma URL, de modo que el
# navegador ve un solo origen y no hay CORS que resolver.
#
# Solo para el entorno de demostracion del ADR 0007. Produccion va en Cloud Run.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SIN contrasena, por decision del propietario (2026-08-15). El sitio queda abierto a
    # quien tenga el enlace. Se acepta porque todavia no hay datos de usuarios ni pagos: lo
    # unico expuesto es trabajo sin terminar. La discoverability sigue cortada por el
    # noindex y el robots.txt de mas abajo.
    #
    # Esto se aparta de la consecuencia escrita en docs/adr/0007: alli se exigia
    # autenticacion propia por estar publicado en internet.
    #
    # VOLVER A CERRARLO es obligatorio antes de que exista la primera cuenta real o el
    # primer pago. Basta con descomentar estas dos lineas: el archivo .htpasswd sigue
    # montado y vigente.
    # auth_basic "Academia Diego Romero — entorno de demostracion";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Cabeceras de seguridad (docs/06 §6).
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Este entorno NO debe aparecer en Google: es material sin terminar bajo la marca
    # personal de Diego.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        # El destino va en una variable a proposito. Con un nombre literal, nginx resuelve
        # el DNS UNA sola vez al arrancar: si la API todavia no esta lista, nginx muere en
        # bucle, y si la API se reinicia y cambia de IP, nginx se queda apuntando a la vieja
        # hasta que alguien lo reinicie a mano. Con variable mas resolver, resuelve por
        # peticion y el sistema se recupera solo.
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker
        set $destino_api http://academia-api:8080;

        # $request_uri conserva la ruta completa y la cadena de consulta. El backend expone
        # sus controladores bajo /api, y /actuator queda en la raiz para el healthcheck.
        proxy_pass         $destino_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------ cache
    #
    # OJO con `add_header`: un bloque hijo que declara UNO SOLO descarta TODOS los del
    # padre, incluso los marcados `always`. Por eso las cabeceras de seguridad se repiten
    # en cada `location` de abajo. No es duplicacion por descuido; quitarlas de aqui deja
    # los .js sin `nosniff`, que es la que importa en un script.

    # Salida de compilacion: lleva huella en el nombre (main-P6LFKYE3.js). Un cambio produce
    # un nombre nuevo, asi que el archivo viejo nunca hace falta: cachear para siempre.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Imagenes con huella de contenido en el nombre (practica-botonadura.dedbd367.webp), que
    # es lo que produce `npm run imagenes:optimizar`. Cambiar la foto cambia el nombre, asi
    # que cachear un anio es seguro: la version vieja nunca vuelve a pedirse.
    location ~* "\.[0-9a-f]{8}\.(webp|avif|png|jpe?g|svg|ico|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Imagenes SIN huella: quedan las sueltas (favicon, og-image). Se cachean corto y
    # revalidando, porque ahi el nombre si puede repetirse con contenido distinto y no hay
    # forma de que una cache se entere.
    location ~* \.(webp|avif|png|jpe?g|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # =404 y no el index: sin esto, una ruta de imagen mal escrita devuelve HTML con
        # `Content-Type: image/webp` y el fallo se ve como una imagen rota sin explicacion.
        try_files $uri =404;
    }

    # index.html NUNCA se cachea sin revalidar. Es la pieza que apunta a los .js con huella:
    # una copia vieja en el navegador significa la aplicacion vieja entera, aunque el
    # servidor ya tenga la nueva. Antes salia SIN cabecera de cache, y sin ella el navegador
    # inventa su propia caducidad a partir de `Last-Modified`.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-Frame-Options           "DENY"                            always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Angular resuelve el enrutado en el navegador, asi que cualquier ruta desconocida
    # devuelve index.html en vez de 404. Hereda la cabecera de arriba por la subpeticion
    # interna de `try_files`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
