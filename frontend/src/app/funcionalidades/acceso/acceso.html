<main class="acceso">
  <!-- ==================================================== PANEL DE MARCA -->
  <!-- El afiche del propietario, entero. Sin una palabra nuestra encima: el afiche ya trae
       la suya y dos textos en la misma columna se pelean.
       Lleva `role="img"` con rótulo, y NO `aria-hidden`: su rotulación quemada es hoy lo
       único que nombra la marca en esta pantalla, y un lector de pantalla no puede leer
       texto que vive dentro de un píxel. El rótulo dice lo que dice el afiche.
       La ruta entra por variable CSS y no escrita en la hoja: las imágenes llevan huella de
       contenido en el nombre, así que el .scss quedaría desactualizado en cuanto se cambiara
       la imagen, y el fallo se vería como un hueco vacío sin error en consola. -->
  <div
    class="acceso__marca"
    role="img"
    aria-label="Academia Diego Romero — aprende a tocar acordeón desde cero"
    [style.--acceso-foto]="afiche"
  ></div>

  <!-- ====================================================== FORMULARIO -->
  <section class="acceso__panel">
    <div class="acceso__caja">
      <!-- El título va sin ver, no eliminado. Sin un `h1` la página se queda sin nombre para
           quien navega con lector de pantalla —que salta de encabezado en encabezado— y sin
           el encabezado que todo buscador y toda auditoría esperan. No ocupa un pixel: lo
           visible es el afiche y los dos botones, que es lo que se pidió. -->
      <h1 class="adr-solo-lectores">Entra a tu cuenta</h1>

      @if (estado() === 'error') {
        <adr-alerta tono="error">{{ mensajeError() }}</adr-alerta>
      }

      <div class="acceso__proveedores">
        <!-- Marca, no icono. Llevaba la «G» de Phosphor: un glifo monocromo que se teñía con
             el color del texto. Se parece a la de Google sin serlo, y su identidad exige el
             logotipo de cuatro colores sin recolorear (ADR 0010). Un logotipo aproximado es
             lo primero que delata que una pantalla de ingreso no es de fiar. -->
        <adr-boton variante="proveedor" marca="google" [anchoCompleto]="true" [enlace]="urlGoogle">
          Continuar con Google
        </adr-boton>

        @if (facebookHabilitado) {
          <adr-boton
            variante="proveedor"
            marca="facebook"
            [anchoCompleto]="true"
            [enlace]="urlFacebook"
          >
            Continuar con Facebook
          </adr-boton>
        }
      </div>

      <div class="acceso__separador"><span>o con tu correo</span></div>

      <form class="acceso__formulario" [formGroup]="formulario" (ngSubmit)="enviar()">
        <adr-campo
          etiqueta="Correo electrónico"
          tipo="email"
          marcador="tucorreo@ejemplo.com"
          autocompletado="email"
          [control]="formulario.controls.correo"
        />

        <adr-campo
          etiqueta="Contraseña"
          tipo="password"
          autocompletado="current-password"
          [control]="formulario.controls.contrasena"
        >
          <!-- Sin enlace: la pantalla de recuperación no existe todavía, y un control que no
               responde al pulsarlo enseña que la aplicación no reacciona. Pero decir
               «próximamente» tampoco ayuda a quien la olvidó AHORA: se le señala la salida
               que sí existe, que además está a dos dedos, justo arriba. -->
          <span accion class="acceso__pendiente">¿La olvidaste? Entra con Google</span>
        </adr-campo>


        <adr-boton
          tipo="submit"
          variante="primario"
          [anchoCompleto]="true"
          [cargando]="estado() === 'enviando'"
        >
          {{ estado() === 'enviando' ? 'Entrando…' : 'Entrar' }}
        </adr-boton>
      </form>

    </div>
  </section>
</main>
